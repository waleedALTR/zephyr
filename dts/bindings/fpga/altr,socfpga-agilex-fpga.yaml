description: |
  Altera/Intel SoCFPGA Agilex FPGA control device (fpga.h).
  on/off map to HPS↔FPGA bridge isolation (SET_HPS_BRIDGES).
  load/status program the fabric via the FPGA manager (full reconfig only).
  Bitstream staging is DT memory (fpga_config), not this node.

  Fabric soft-IP should be child nodes of this FPGA node (with
  #address-cells/#size-cells/ranges). Status-okay children are
  device_init()'d after bridges are enabled (fpga_on) and
  device_deinit()'d before bridges are isolated (fpga_off).
  Those children should use zephyr,deferred-init.

compatible: "altr,socfpga-agilex-fpga"

include: base.yaml

properties:
  "#address-cells":
    type: int
    const: 1
    description: |
      Required when this node has soft-IP children with reg properties.
  "#size-cells":
    type: int
    const: 1
    description: |
      Required when this node has soft-IP children with reg properties.
