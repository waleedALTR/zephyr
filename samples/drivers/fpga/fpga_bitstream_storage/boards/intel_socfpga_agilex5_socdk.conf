CONFIG_ALTERA_AGILEX_BRIDGE_FPGA=y
CONFIG_ARM_SIP_SVC_DRIVER=y
CONFIG_ARM_SIP_SVC_SUBSYS=y

CONFIG_FPGA_LOG_LEVEL_WRN=y
CONFIG_ARM_SIP_SVC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_ARM_SIP_SVC_SUBSYS_LOG_LEVEL_WRN=y

# The FPGA driver and the SiP SVC subsystem allocate from the kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Upload the bitstream image to the bitstream partition with MCUmgr

# MCUmgr core
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=4608

# SMP over the shell UART
CONFIG_SHELL=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=4096
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=48
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1536

# Image management writes the image to the secondary slot
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y

# "mcumgr reset" reboots, and the new bitstream is loaded at boot
CONFIG_REBOOT=y
CONFIG_MCUMGR_GRP_OS=y

# SMP commands and the flash writes run on the system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
