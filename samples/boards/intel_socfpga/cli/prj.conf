# Enable Shell
CONFIG_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=1024

# Enable Device Shell to Access Basic Device Data
CONFIG_DEVICE_SHELL=y
CONFIG_DEVMEM_SHELL=y

#Misc
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192

# FPGA Manager: keep stage / DMA / status results visible
CONFIG_FPGA_MANAGER_LOG_LEVEL_INF=y

# Quiet SiP/SMC poll spam ("no valid polling response", msgq wakeups, timing)
CONFIG_ARM_SIP_SVC_SUBSYS_LOG_LEVEL_ERR=y
CONFIG_ARM_SIP_SVC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_FPGA_BRIDGE_LOG_LEVEL_ERR=y

# FPGA Bridge (shell helper; manager uses Altera FPGA driver below)
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_BRIDGE_INTEL=y
CONFIG_FPGA_BRIDGE_SHELL=y

# Altera Agilex bridge device (fpga0) used by FPGA manager
CONFIG_FPGA=y
CONFIG_ALTERA_AGILEX_BRIDGE_FPGA=y

# FPGA Manager (load needs the shell command)
CONFIG_FPGA_MANAGER=y
CONFIG_FPGA_MANAGER_INTEL=y
CONFIG_FPGA_MANAGER_SHELL=y
CONFIG_FPGA_MANAGER_THREAD_STACK_SIZE=4096

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y
