sample:
  name: LLEXT dynamic device
  description: Run GPIO drivers from extensions
common:
  tags: llext
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "gpio@[0-9a-f]+ ready before load: no"
      - "gpio@[0-9a-f]+ ready after bind: yes"
      - "gpio@[0-9a-f]+ pin 3: logical 0, raw 1, reg 0x5a"
      - "gpio@[0-9a-f]+ pin 3: logical 1, raw 0, reg 0x52"
      - "gpio@[0-9a-f]+ pin 3: logical 0, raw 1, reg 0x5a"
      - "gpio@[0-9a-f]+ ready after unbind: no"
      - "gpio@[0-9a-f]+ ready before load: no"
      - "gpio@[0-9a-f]+ ready after bind: yes"
      - "gpio@[0-9a-f]+ pin 5: logical 0, raw 0, reg 0x00"
      - "gpio@[0-9a-f]+ pin 5: logical 1, raw 1, reg 0x20"
      - "gpio@[0-9a-f]+ pin 5: logical 0, raw 0, reg 0x00"
      - "gpio@[0-9a-f]+ ready after unbind: no"
      - "Dynamic device sample done"
tests:
  sample.llext.dynamic_device:
    platform_allow:
      - qemu_cortex_a9
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a9
      - qemu_cortex_a53
  sample.llext.dynamic_device.buffer:
    platform_allow:
      - qemu_cortex_a9
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a9
      - qemu_cortex_a53
    extra_configs:
      - CONFIG_DRIVER_MODULE_FS=n
  sample.llext.dynamic_device.agilex5:
    build_only: true
    platform_allow:
      - intel_socfpga_agilex5_socdk
    integration_platforms:
      - intel_socfpga_agilex5_socdk
