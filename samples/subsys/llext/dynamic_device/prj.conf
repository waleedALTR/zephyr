CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_GPIO=y
# Built into the extension instead of the image
CONFIG_GPIO_MMIO_LATCH=n

CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

# Device structure in RAM so its driver fields can be filled at runtime
CONFIG_DEVICE_MUTABLE=y
CONFIG_DEVICE_DEINIT_SUPPORT=y

# Loading an llext needs a large stack (see issue #74536)
CONFIG_MAIN_STACK_SIZE=4096
