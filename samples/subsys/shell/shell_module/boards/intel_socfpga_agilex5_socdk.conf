# Misc — larger heap for TFTP / flash shell buffers
CONFIG_HEAP_MEM_POOL_SIZE=2097152
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_CMD_BUFF_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=262144

# Setting the max argc (tftp get uses many -s/-f/-a/-z flags)
CONFIG_SHELL_ARGC_MAX=20

# Enable the Zephyr boot banner
CONFIG_BOOT_BANNER=y

# Enable QSPI Flash + NAND programming via flash shell
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SHELL=y

# NAND storage partition as a Dhara FTL disk ("NAND")
CONFIG_FLASH_MAP=y
CONFIG_DISK_ACCESS=y

# Networking / Ethernet (xgmac0)
# Board-server eth1 = 192.168.9.100/24 (TFTP host).
# Do NOT enable DHCP — it can overwrite the static board IP.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_MDIO=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.9.197"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.9.100"
CONFIG_NET_CONFIG_INIT_TIMEOUT=30
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=1024
CONFIG_NET_BUF_TX_COUNT=512
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# TFTP client shell: net tftp get/put + get_ddr/put_ddr
CONFIG_NET_SHELL=y
CONFIG_TFTP_LIB=y
CONFIG_NET_SHELL_TFTP_CLIENT_SUPPORTED=y
CONFIG_POSIX_API=y
CONFIG_DNS_RESOLVER=n

# SDMMC / FAT FS: not forced here. Selected via Kconfig choice
# SHELL_MODULE_STORAGE_* (defaults to NAND when DT enables Cadence NAND,
# which disables DISK_ACCESS / SDHC / FAT FS shell). Force SDMMC with:
#   -DCONFIG_SHELL_MODULE_STORAGE_SDMMC=y

# Enable timer driver
CONFIG_COUNTER=y

# Enable Timer shell commands
CONFIG_COUNTER_SHELL=y

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_WDT_SHELL=y
# Keep the watchdog stopped until "wdt setup" is issued from the shell
CONFIG_WDT_DISABLE_AT_BOOT=y

# DMA driver
CONFIG_DMA=y
CONFIG_DMA_DW_AXI_MAX_DESC=50

# PSCI shell Enable
CONFIG_PSCI_SHELL=y

#SiP SVC Service
CONFIG_ARM_SIP_SVC_DRIVER=y
CONFIG_ARM_SIP_SVC_SUBSYS=y
CONFIG_ARM_SIP_SVC_SUBSYS_SINGLY_OPEN=y

#SiP SVC Service Shell
CONFIG_ARM_SIP_SVC_SUBSYS_SHELL=y

# GPIO
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y
CONFIG_GPIO_SHELL_INFO_CMD=n

#I2C driver & shell
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

#I3C driver & shell
CONFIG_I3C=y
CONFIG_I3C_DW=y
CONFIG_I3C_SHELL=y
CONFIG_SENSOR=y
CONFIG_LPS22HH=y
CONFIG_CLOCK_CONTROL=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="NAND"